version: '3.8'

services:
  # 1. Database: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: compliance_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123  # Nhớ khớp với appsettings.json
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d        # Chạy script tạo bảng init.sql
      - postgres_data:/var/lib/postgresql/data       # Giữ dữ liệu không bị mất

  # 2. Backend: ASP.NET Core API
  dotnet-api:
    build: 
      context: ./Backend/ComplianceApi               # Trỏ đúng vào folder chứa project .NET
      dockerfile: Dockerfile
    container_name: dotnet_backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=compliance_db;Username=admin;Password=admin123
      - FileStorage__LocalPath=InternalStorage/Documents
      - AIService__Url=http://python-ai:8000/analyze
    depends_on:
      - db
    ports:
      - "5000:8080"
    volumes:
      # Ánh xạ thư mục data_storage từ máy thật vào trong container .NET
      - ./data_storage:/app/InternalStorage/Documents

  # 3. AI Service: Python FastAPI
  python-ai:
    build: 
      context: ./AI_Service                          # Trỏ vào folder chứa code Python
      dockerfile: Dockerfile
    container_name: python_ai
    environment:
      - OPENAI_API_KEY=your_openai_key_here
    depends_on:
      - dotnet-api
    ports:
      - "8000:8000"
    volumes:
      # QUAN TRỌNG: Python cũng ánh xạ chung thư mục data_storage để đọc file .NET vừa lưu
      - ./data_storage:/app/data_to_analyze

volumes:
  postgres_data:                                     # Khai báo Named Volume cho Database